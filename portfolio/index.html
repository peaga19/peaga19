<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peaga Quint | Desenvolvedor Full Stack & Automações com IA</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para transpilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00F5D4',
              purple: '#7928CA',
              pink: '#FF007A',
              dark: '#0D1117',
              card: '#161B22',
              border: '#30363D'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Inter', sans-serif;
    }
    .neon-glow-cyan {
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.25);
    }
    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(0, 245, 212, 0.5);
    }
    .gradient-text {
      background: linear-gradient(135deg, #00f5d4 0%, #7928ca 50%, #ff007a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SKILLS = [
      { name: "Python", category: "Backend / IA", icon: "🐍", desc: "Scripts, automações avançadas, APIs e engenharia de dados", color: "from-blue-500 to-indigo-600" },
      { name: "React", category: "Frontend", icon: "⚛️", desc: "Aplicações SPA, hooks reativos, componentização moderna", color: "from-cyan-400 to-blue-500" },
      { name: "Automações com IA", category: "Inteligência Artificial", icon: "🤖", desc: "Integração de LLMs, agentes inteligentes e fluxos automatizados", color: "from-purple-500 to-pink-500" },
      { name: "SQL", category: "Banco de Dados", icon: "🗄️", desc: "PostgreSQL, MySQL, modelagem relacional e otimização de queries", color: "from-emerald-400 to-teal-600" },
      { name: "JavaScript (ES6+)", category: "Frontend / Full Stack", icon: "⚡", desc: "Lógica assíncrona, DOM, Promises e ecossistema moderno", color: "from-amber-400 to-yellow-500" },
      { name: "HTML5 & CSS3", category: "Frontend", icon: "🎨", desc: "Layouts responsivos, flexbox, grid, animações e acessibilidade", color: "from-orange-500 to-red-500" }
    ];

    const PROJECTS = [
      {
        title: "Agente Autônomo com IA & Python",
        desc: "Pipeline automatizado em Python consumindo APIs de IA generativa com persistência em banco de dados SQL.",
        tags: ["Python", "Automações IA", "SQL"],
        link: "https://github.com/peaga19"
      },
      {
        title: "Dashboard Interativo em React",
        desc: "Painel administrativo moderno com visualização de métricas em tempo real e interface responsiva com CSS/Tailwind.",
        tags: ["React", "JavaScript", "CSS3", "HTML5"],
        link: "https://github.com/peaga19"
      },
      {
        title: "Sistema de Gerenciamento & Queries SQL",
        desc: "Modelagem de dados complexa, criação de triggers, views e consultas otimizadas para alto volume.",
        tags: ["SQL", "Python"],
        link: "https://github.com/peaga19"
      }
    ];

    function App() {
      const [filter, setFilter] = useState("Todos");
      const [terminalInput, setTerminalInput] = useState("");
      const [terminalLogs, setTerminalLogs] = useState([
        "peaga@os:~$ Sistema inicializado.",
        "peaga@os:~$ Especialidades carregadas: Python, React, JS, HTML, CSS, SQL, Automações com IA.",
        "peaga@os:~$ Digite 'help' para ver os comandos disponíveis."
      ]);

      const handleTerminalSubmit = (e) => {
        e.preventDefault();
        const cmd = terminalInput.trim().toLowerCase();
        let reply = "";

        if (cmd === "help") {
          reply = "Comandos: help, skills, bio, clear, contact";
        } else if (cmd === "skills") {
          reply = "Stack: Python | React | HTML5 | CSS3 | JavaScript | Automações com IA | SQL";
        } else if (cmd === "bio") {
          reply = "Peaga Quint - Desenvolvedor Full Stack & Especialista em Automações Inteligentes.";
        } else if (cmd === "contact") {
          reply = "GitHub: https://github.com/peaga19";
        } else if (cmd === "clear") {
          setTerminalLogs([]);
          setTerminalInput("");
          return;
        } else if (cmd) {
          reply = `Comando não reconhecido: '${cmd}'. Tente 'help'.`;
        }

        if (cmd) {
          setTerminalLogs(prev => [...prev, `peaga@os:~$ ${terminalInput}`, reply].filter(Boolean));
        }
        setTerminalInput("");
      };

      const categories = ["Todos", "Backend / IA", "Frontend", "Banco de Dados", "Inteligência Artificial"];

      const filteredSkills = filter === "Todos" 
        ? SKILLS 
        : SKILLS.filter(s => s.category.includes(filter));

      return (
        <div className="min-h-screen bg-[#0d1117] text-gray-200">
          {/* Barra de Navegação */}
          <nav className="border-b border-[#30363d] bg-[#161b22]/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
              <a href="https://github.com/peaga19" className="text-xl font-bold font-mono tracking-tight text-white flex items-center gap-2">
                <span className="text-[#00f5d4]">&lt;</span>
                Peaga Quint
                <span className="text-[#00f5d4]">/&gt;</span>
              </a>
              <div className="flex items-center gap-6 text-sm font-medium">
                <a href="#sobre" className="hover:text-[#00f5d4] transition">Sobre</a>
                <a href="#habilidades" className="hover:text-[#00f5d4] transition">Especialidades</a>
                <a href="#projetos" className="hover:text-[#00f5d4] transition">Projetos</a>
                <a href="#terminal" className="hover:text-[#00f5d4] transition">Terminal</a>
                <a 
                  href="https://github.com/peaga19" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="px-4 py-2 rounded-lg bg-gradient-to-r from-cyan-400 to-purple-600 text-black font-semibold hover:opacity-90 transition shadow-lg shadow-cyan-500/20"
                >
                  GitHub Perfil
                </a>
              </div>
            </div>
          </nav>

          {/* Hero Header */}
          <header className="max-w-6xl mx-auto px-6 pt-20 pb-16 text-center" id="sobre">
            <div className="inline-block px-4 py-1.5 rounded-full border border-cyan-400/30 bg-cyan-950/20 text-cyan-300 text-xs font-mono uppercase tracking-wider mb-6">
              🚀 Disponível para Desenvolvimento & Automações
            </div>

            <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">
              Transformando Ideias em Código com <br />
              <span className="gradient-text">Python, React & Automações de IA</span>
            </h1>

            <p className="max-w-2xl mx-auto text-gray-400 text-lg mb-8 leading-relaxed">
              Desenvolvedor focado na construção de aplicações web interativas (React, JS, HTML, CSS), 
              engenharia de dados com SQL e automações inteligentes com Inteligência Artificial em Python.
            </p>

            <div className="flex flex-wrap items-center justify-center gap-4">
              <a 
                href="https://github.com/peaga19" 
                target="_blank" 
                className="px-6 py-3 rounded-lg bg-[#00f5d4] text-[#0d1117] font-bold hover:bg-[#00d8bc] transition flex items-center gap-2 neon-glow-cyan"
              >
                Ver Repositórios no GitHub ↗
              </a>
              <a 
                href="#terminal" 
                className="px-6 py-3 rounded-lg border border-[#30363d] bg-[#161b22] text-gray-200 hover:border-gray-500 transition font-mono text-sm"
              >
                Abrir Terminal Interativo
              </a>
            </div>
          </header>

          {/* Seção Especialidades */}
          <section className="max-w-6xl mx-auto px-6 py-16" id="habilidades">
            <div className="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
              <div>
                <h2 className="text-3xl font-bold text-white mb-2">Especialidades & Tech Stack</h2>
                <p className="text-gray-400">Tecnologias dominadas para soluções completas e de alta performance.</p>
              </div>

              {/* Filtro por categoria */}
              <div className="flex flex-wrap gap-2">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setFilter(cat)}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${
                      filter === cat
                        ? "bg-[#00f5d4] text-[#0d1117] font-bold"
                        : "bg-[#161b22] text-gray-400 border border-[#30363d] hover:text-white"
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredSkills.map((skill, idx) => (
                <div 
                  key={idx}
                  className="bg-[#161b22] border border-[#30363d] p-6 rounded-xl hover:border-cyan-400/50 transition group hover:shadow-xl hover:shadow-cyan-500/5 relative overflow-hidden"
                >
                  <div className={`absolute top-0 left-0 right-0 h-1 bg-gradient-to-r ${skill.color}`}></div>
                  <div className="text-4xl mb-4 group-hover:scale-110 transition transform origin-left">
                    {skill.icon}
                  </div>
                  <span className="text-xs font-mono text-cyan-400/90 uppercase tracking-wider block mb-1">
                    {skill.category}
                  </span>
                  <h3 className="text-xl font-bold text-white mb-2">{skill.name}</h3>
                  <p className="text-gray-400 text-sm leading-relaxed">{skill.desc}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Seção Terminal Interativo */}
          <section className="max-w-6xl mx-auto px-6 py-16" id="terminal">
            <h2 className="text-3xl font-bold text-white mb-2">Terminal Shell Interativo</h2>
            <p className="text-gray-400 mb-6">Experimente o terminal simulado criado em React & JavaScript.</p>

            <div className="bg-[#0b0e14] border border-[#30363d] rounded-xl overflow-hidden shadow-2xl font-mono text-sm">
              <div className="bg-[#161b22] px-4 py-3 flex items-center justify-between border-b border-[#30363d]">
                <div className="flex items-center gap-2">
                  <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
                  <div className="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                  <div className="w-3 h-3 rounded-full bg-green-500/80"></div>
                </div>
                <span className="text-xs text-gray-400">peaga19@github: ~ (bash)</span>
                <span className="text-xs text-cyan-400">ONLINE</span>
              </div>

              <div className="p-6 max-h-72 overflow-y-auto space-y-2">
                {terminalLogs.map((log, index) => (
                  <div key={index} className="text-gray-300 leading-relaxed">{log}</div>
                ))}
              </div>

              <form onSubmit={handleTerminalSubmit} className="border-t border-[#30363d] px-6 py-3 flex items-center gap-3 bg-[#11161d]">
                <span className="text-[#00f5d4] font-bold">&gt;</span>
                <input 
                  type="text" 
                  value={terminalInput}
                  onChange={(e) => setTerminalInput(e.target.value)}
                  placeholder="Digite um comando (ex: 'help', 'skills', 'bio')..."
                  className="w-full bg-transparent border-none outline-none text-white font-mono placeholder-gray-600"
                />
                <button type="submit" className="text-xs bg-[#30363d] hover:bg-[#00f5d4] hover:text-black text-gray-300 px-3 py-1.5 rounded transition">
                  Executar
                </button>
              </form>
            </div>
          </section>

          {/* Seção Projetos */}
          <section className="max-w-6xl mx-auto px-6 py-16" id="projetos">
            <h2 className="text-3xl font-bold text-white mb-2">Projetos & Portfólio</h2>
            <p className="text-gray-400 mb-8">Soluções integradas com desenvolvimento Full Stack e Inteligência Artificial.</p>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {PROJECTS.map((proj, idx) => (
                <div key={idx} className="bg-[#161b22] border border-[#30363d] p-6 rounded-xl flex flex-col justify-between hover:border-purple-500/50 transition">
                  <div>
                    <h3 className="text-xl font-bold text-white mb-2">{proj.title}</h3>
                    <p className="text-gray-400 text-sm mb-4 leading-relaxed">{proj.desc}</p>
                    <div className="flex flex-wrap gap-2 mb-6">
                      {proj.tags.map((tag, tIdx) => (
                        <span key={tIdx} className="px-2.5 py-1 rounded bg-[#0d1117] border border-[#30363d] text-xs font-mono text-gray-300">
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>
                  <a 
                    href={proj.link} 
                    target="_blank" 
                    className="text-cyan-400 text-sm font-semibold hover:underline inline-flex items-center gap-1"
                  >
                    Acessar Repositório &rarr;
                  </a>
                </div>
              ))}
            </div>
          </section>

          {/* Rodapé */}
          <footer className="border-t border-[#30363d] py-10 text-center text-sm text-gray-500">
            <p className="mb-2">Desenvolvido com React, Tailwind CSS, JavaScript e HTML5.</p>
            <p>
              Perfil do GitHub:{" "}
              <a href="https://github.com/peaga19" className="text-[#00f5d4] hover:underline">
                @peaga19 (Peaga Quint)
              </a>
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
