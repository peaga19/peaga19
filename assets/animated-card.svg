<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
          border: 1px solid rgba(0, 245, 212, 0.3);
          border-radius: 16px;
          padding: 24px 32px;
          color: #c9d1d9;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glow-circle {
          position: absolute;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(121, 40, 202, 0.25) 0%, rgba(0, 245, 212, 0) 70%);
          top: -60px;
          right: -40px;
          border-radius: 50%;
          animation: pulse 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
          0% { transform: scale(0.9); opacity: 0.6; }
          100% { transform: scale(1.2); opacity: 0.9; }
        }

        h2 {
          margin: 0;
          font-size: 26px;
          font-weight: 700;
          background: linear-gradient(90deg, #00f5d4, #7928ca, #ff007a);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        p.subtitle {
          margin: 6px 0 16px 0;
          font-size: 14px;
          color: #8b949e;
        }

        .tags {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
        }

        .tag {
          display: inline-flex;
          align-items: center;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 8px;
          padding: 6px 14px;
          font-size: 13px;
          font-weight: 600;
          color: #f0f6fc;
          transition: all 0.3s ease;
        }

        .tag-python { border-color: #3776ab; color: #58a6ff; }
        .tag-react { border-color: #61dafb; color: #7ee787; }
        .tag-js { border-color: #f7df1e; color: #f1e05a; }
        .tag-css { border-color: #1572b6; color: #79c0ff; }
        .tag-ai { border-color: #ff007a; color: #ff7b72; }
        .tag-sql { border-color: #00f5d4; color: #00f5d4; }
      </style>

      <div class="container">
        <div class="glow-circle"></div>
        <h2>⚡ Peaga Quint | Especialidades &amp; Inovação</h2>
        <p class="subtitle">Desenvolvimento Web Reativo &bull; Automações com Inteligência Artificial &bull; Banco de Dados</p>

        <div class="tags">
          <span class="tag tag-python">🐍 Python</span>
          <span class="tag tag-react">⚛️ React</span>
          <span class="tag tag-js">⚡ JavaScript</span>
          <span class="tag tag-css">🎨 HTML5 &amp; CSS3</span>
          <span class="tag tag-ai">🤖 Automações com IA</span>
          <span class="tag tag-sql">🗄️ SQL</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>

